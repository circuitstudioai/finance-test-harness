name: Manual finance repository bake-off

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Smoke-test updated integrations without LLM calls, or run the paid AAPL case"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - evaluate

permissions:
  contents: read

jobs:
  candidate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tradingagents
            repository: circuitstudioai/TradingAgents
            ref: 9dee508c44662702281a8dbaad1f7b42179b5ba7
            install: python -m pip install -e candidate
          - name: ai-hedge-fund
            repository: circuitstudioai/ai-hedge-fund
            ref: fc1bf250ead209ae5f02c39c3d0062c4bb554505
            install: python -m pip install -e candidate
          - name: daily-stock-analysis
            repository: circuitstudioai/daily_stock_analysis
            ref: 303f4e1c18b7e149bc2b7618eb63a6574507bc6b
            install: python -m pip install -r candidate/requirements.txt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check out pinned candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: candidate

      - name: Install candidate
        run: ${{ matrix.install }}

      - name: Run candidate smoke test or one-case bake-off
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LITELLM_MODEL: gemini/gemini-3.5-flash
          AGENT_LITELLM_MODEL: gemini/gemini-3.5-flash
          REPORT_LANGUAGE: en
          AGENT_MODE: "true"
          AGENT_ARCH: single
          AGENT_MAX_STEPS: "4"
          ENABLE_WEB_SEARCH: "false"
          MARKET_REVIEW_ENABLED: "false"
          TRADINGAGENTS_MAX_TOKENS: "2048"
          TRADINGAGENTS_LLM_MAX_RETRIES: "0"
        run: python scripts/bakeoff/run_candidate.py "${{ matrix.name }}" candidate "artifacts/${{ matrix.name }}.json" --mode "${{ inputs.mode }}"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakeoff-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 14
